<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Thesaurus Literarius</title>
    <link rel="stylesheet" href="css/Style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header>
        <div class="logo">  
            <h1>Thesaurus Literarius - Admin</h1> 
        </div>
        <nav>
            <a href="index.html">Back to Home</a>
            <a href="#" class="logout">Logout</a>
        </nav>
    </header>

    <main class="admin-container">
        <div class="admin-header">
            <h2>Book Management</h2>
            <button id="openModalBtn" class="btn-add">
                <span class="icon">+</span>
                Add New Book
            </button>
        </div>

        <div class="books-table-container">
            <table class="books-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Available</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="booksTableBody">
                    <tr>
                        <td colspan="8" class="loading">Loading books...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="bookModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Book</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="bookForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Book Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="autor">Author</label>
                            <input type="text" id="autor" name="autor" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category" required>
                                <option value="">Select a category</option>
                                <option value="Fiction">Fiction</option>
                                <option value="Non-Fiction">Non-Fiction</option>
                                <option value="Science Fiction">Science Fiction</option>
                                <option value="Fantasy">Fantasy</option>
                                <option value="Mystery">Mystery</option>
                                <option value="Romance">Romance</option>
                                <option value="Children">Children</option>
                                <option value="Biography">Biography</option>
                                <option value="History">History</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">Publication Date</label>
                            <input type="date" id="date" name="date" required>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="totalCopies">Total Copies</label>
                            <input type="number" id="totalCopies" name="totalCopies" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="copiesAvailable">Copies Available</label>
                            <input type="number" id="copiesAvailable" name="copiesAvailable" min="0" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn-submit">Add Book</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
